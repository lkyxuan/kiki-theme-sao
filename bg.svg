<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 自己画的虚化天空和远处的城镇，不取自任何作品 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3e6"/><stop offset=".55" stop-color="#bcd9f2"/><stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="far" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity=".85" filter="url(#soft)">
    <ellipse cx="260" cy="210" rx="220" ry="60"/><ellipse cx="420" cy="180" rx="160" ry="70"/>
    <ellipse cx="1180" cy="140" rx="260" ry="70"/><ellipse cx="1360" cy="170" rx="180" ry="60"/>
    <ellipse cx="820" cy="320" rx="300" ry="50"/>
  </g>
  <g filter="url(#far)">
    <path d="M0 720 C200 640 360 660 520 700 S860 640 1040 690 S1380 650 1600 700 V1000 H0Z" fill="#9db8c9"/>
    <path d="M0 780 C240 730 420 760 640 780 S1080 740 1300 770 S1500 760 1600 770 V1000 H0Z" fill="#8fae8a"/>
    <g fill="#c9b9a3">
      <rect x="560" y="700" width="40" height="90"/><rect x="610" y="680" width="30" height="110"/><path d="M606 680 L625 640 L644 680Z"/>
      <rect x="650" y="720" width="60" height="70"/><rect x="720" y="690" width="36" height="100"/><path d="M716 690 L738 655 L760 690Z"/>
      <rect x="770" y="730" width="70" height="60"/><rect x="850" y="705" width="28" height="85"/>
    </g>
    <g fill="#b0645a" opacity=".8">
      <path d="M646 720 L680 700 L714 720Z"/><path d="M766 730 L805 708 L844 730Z"/>
    </g>
  </g>
  <rect width="1600" height="1000" fill="#fff" opacity=".18"/>
</svg>
